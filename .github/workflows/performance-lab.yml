{
  "name": "Performance Lab checks",
  "on": {
    "push": {
      "branches": [
        "codex/nbsr-v3-wp0-wp1"
      ]
    },
    "pull_request": {},
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "performance-lab": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 15,
      "defaults": {
        "run": {
          "shell": "pwsh",
          "working-directory": "tools/performance-lab"
        }
      },
      "env": {
        "PIP_DISABLE_PIP_VERSION_CHECK": "1",
        "PYTHONDONTWRITEBYTECODE": "1",
        "GOMAXPROCS": "2"
      },
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 1,
            "sparse-checkout": "tools/performance-lab"
          }
        },
        {
          "uses": "actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97",
          "with": {
            "python-version": "3.13.14"
          }
        },
        {
          "uses": "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1",
          "with": {
            "node-version": "24.19.0",
            "package-manager-cache": false
          }
        },
        {
          "name": "Install Performance Lab Python pins",
          "run": "python -m pip install -r requirements-dev.txt",
          "timeout-minutes": 5
        },
        {
          "name": "Install locked frontend dependencies without lifecycle scripts",
          "run": "npm ci --ignore-scripts --no-audit --no-fund",
          "timeout-minutes": 5
        },
        {
          "name": "Synthetic Performance Lab Python tests",
          "run": "python -B -m pytest -q -p no:cacheprovider tests",
          "timeout-minutes": 3
        },
        {
          "name": "Frontend Node regressions",
          "run": "node --experimental-strip-types --test tests/frontend.test.mjs",
          "timeout-minutes": 2
        },
        {
          "name": "Frontend typecheck",
          "run": "npm run typecheck",
          "timeout-minutes": 2
        },
        {
          "name": "Frontend build",
          "run": "npm run build",
          "timeout-minutes": 2
        },
        {
          "name": "Verify dependency manifests remain unchanged",
          "run": "git diff --exit-code -- package.json package-lock.json requirements.txt requirements-dev.txt",
          "timeout-minutes": 1
        }
      ]
    }
  }
}
