{
  "name": "Demo Lab component checks",
  "on": {
    "push": {
      "branches": [
        "codex/nbsr-v3-wp0-wp1"
      ]
    },
    "pull_request": {},
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}",
    "cancel-in-progress": true
  },
  "env": {
    "PIP_DISABLE_PIP_VERSION_CHECK": "1"
  },
  "jobs": {
    "demo-lab": {
      "runs-on": "${{ matrix.os }}",
      "timeout-minutes": 10,
      "defaults": {
        "run": {
          "shell": "pwsh"
        }
      },
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "os": [
            "ubuntu-24.04",
            "windows-2025"
          ]
        }
      },
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "uses": "actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97",
          "with": {
            "python-version": "3.13.14"
          }
        },
        {
          "uses": "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1",
          "with": {
            "node-version": "24.19.0",
            "package-manager-cache": false
          }
        },
        {
          "name": "Install constrained component-test dependency",
          "run": "python -m pip install --constraint constraints/dev.txt pytest",
          "timeout-minutes": 3
        },
        {
          "name": "Validate workflow contracts",
          "run": "python scripts/ci/check.py validate",
          "timeout-minutes": 1
        },
        {
          "name": "Demo Lab component tests (no NBSR workload)",
          "run": "python -m pytest -q -p no:cacheprovider tools/demo-lab/tests tests/ci/test_demo_lab_workflow.py",
          "timeout-minutes": 5
        },
        {
          "name": "Demo Lab dependency-free UI regressions",
          "run": "node tools/demo-lab/tests/test_ui.cjs tools/demo-lab/static/app.js",
          "timeout-minutes": 1
        }
      ]
    }
  }
}
