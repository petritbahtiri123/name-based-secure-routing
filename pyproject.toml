[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nbsr"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "cbor2>=5.7,<6",
  "cryptography>=44,<46",
  "dnslib>=0.9.26,<0.10",
  "fastapi>=0.115,<0.117",
  "httpx>=0.28,<0.29",
  "pydantic-settings>=2.7,<3",
  "PyJWT>=2.10,<3",
  "uvicorn>=0.34,<0.36",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.136,<7",
  "pytest>=8.3,<9",
  "pytest-asyncio>=1.4,<2",
  "ruff>=0.9,<0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
  "error::DeprecationWarning:nbsr(\\.|$)",
  "error::PendingDeprecationWarning:nbsr(\\.|$)",
]

[tool.ruff]
line-length = 140
target-version = "py313"

[tool.setuptools.packages.find]
include = ["nbsr*"]
